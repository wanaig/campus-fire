spring:
  application:
    name: campus-fire-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/campus_fire?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:campus_fire}
    password: ${DB_PASSWORD:campus_fire_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never

logging:
  level:
    root: INFO
    com.campusfire: INFO

security:
  jwt:
    secret: ${JWT_SECRET:campus-fire-development-secret-change-before-production-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
  inspection-photo:
    storage-path: ${INSPECTION_PHOTO_STORAGE_PATH:../data/inspection-photos}
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD:Admin@123}
  seed-demo:
    enabled: ${SEED_DEMO_ENABLED:true}
    guard-password: ${SEED_DEMO_GUARD_PASSWORD:Guard@123}
    collector-password: ${SEED_DEMO_COLLECTOR_PASSWORD:Collect@123}
