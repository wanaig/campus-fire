spring:
  application:
    name: campus-fire-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://172.18.0.1:3306/campus_fire?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:campus_fire}
    password: ${DB_PASSWORD:campus_fire_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  redis:
    host: ${REDIS_HOST:172.18.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never

logging:
  level:
    root: INFO
    com.campusfire: INFO

security:
  jwt:
    secret: ${JWT_SECRET:campus-fire-development-secret-change-before-production-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

app:
  cors:
    # 生产（47.96.95.149）：管理后台经 Nginx 80 端口分发；本地开发用环境变量覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://47.96.95.149,http://47.96.95.149:5173,http://localhost:5173,http://127.0.0.1:5173}
  inspection-photo:
    storage: ${INSPECTION_PHOTO_STORAGE:rustfs}
    storage-path: ${INSPECTION_PHOTO_STORAGE_PATH:../data/inspection-photos}
    rustfs:
      # RustFS S3 API 端点（9000 端口）；控制台地址为 http://47.96.95.149:9001/rustfs/console
      endpoint: ${RUSTFS_ENDPOINT:http://47.96.95.149:9000}
      access-key: ${RUSTFS_ACCESS_KEY:}
      secret-key: ${RUSTFS_SECRET_KEY:}
      bucket: ${RUSTFS_BUCKET:rjxy}
      region: ${RUSTFS_REGION:us-east-1}
  seed-admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD:123456}
  # 演示账号（guard/collector）默认不创建；本地联调可用 SEED_DEMO_ENABLED=true 开启
  seed-demo:
    enabled: ${SEED_DEMO_ENABLED:false}
